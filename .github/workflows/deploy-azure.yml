# ============================================================
# Deploy humanityplusai.org to Azure Container Apps
#
# Trigger: every push to `main` (or run manually from the Actions tab).
# Steps:  sync media/training-videos → Blob Storage
#         → build the Docker image → push to Azure Container Registry
#         → point the `humanity-ai` Container App at the new image.
#
# Auth: federated (OIDC) - no secret stored in GitHub.
# One-time setup is documented in deploy/AZURE_RUNBOOK.md.
# ============================================================
name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "deploy/**"
      - "artifacts/humanity-ai-mobile/**"
      - "artifacts/mockup-sandbox/**"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: rg-humanityplusai
  ACR_NAME: acrhumanityplusai
  IMAGE_NAME: humanity-ai
  CONTAINER_APP: humanity-ai
  SUBSCRIPTION_ID: 33680346-29fc-4366-845d-a04681b59a52
  STORAGE_ACCOUNT: sthumanityplusai
  VIDEO_CONTAINER: training-videos

permissions:
  contents: read
  id-token: write   # required for federated (OIDC) login to Azure

jobs:
  build-and-deploy:
    name: Build image & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # Federated (OIDC) login - no stored password. These three IDs are
      # identifiers, not secrets; access comes from the federated credential
      # on the gh-humanity-ai-deploy app, which only trusts tokens issued to
      # this repository's main branch.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: f36dc42d-759d-49d5-a86f-2cd56955c940
          tenant-id: 81099b22-b661-4c71-8aba-a8670f2b9ae7
          subscription-id: 33680346-29fc-4366-845d-a04681b59a52

      - name: Sync video clips to Blob Storage
        # media/training-videos -> public container `training-videos` (streamed by the site).
        # Uses an account key fetched at run time (never stored) because the data-plane
        # OAuth path can report success without creating the container.
        run: |
          set -euo pipefail

          echo "==> Allowing anonymous blob reads on $STORAGE_ACCOUNT"
          az storage account update -n "$STORAGE_ACCOUNT" -g "$AZURE_RESOURCE_GROUP" \
            --allow-blob-public-access true --output none

          KEY=$(az storage account keys list -n "$STORAGE_ACCOUNT" -g "$AZURE_RESOURCE_GROUP" \
                  --query "[0].value" -o tsv)
          if [ -z "$KEY" ]; then echo "Could not read a storage account key"; exit 1; fi

          echo "==> Ensuring container $VIDEO_CONTAINER exists (public read)"
          az storage container create --name "$VIDEO_CONTAINER" --account-name "$STORAGE_ACCOUNT" \
            --account-key "$KEY" --public-access blob --output table

          # Fail loudly rather than uploading into thin air
          if ! az storage container show --name "$VIDEO_CONTAINER" --account-name "$STORAGE_ACCOUNT" \
                 --account-key "$KEY" --output none; then
            echo "Container $VIDEO_CONTAINER still does not exist - aborting"; exit 1
          fi

          echo "==> Uploading clips"
          az storage blob upload-batch --account-name "$STORAGE_ACCOUNT" --account-key "$KEY" \
            --destination "$VIDEO_CONTAINER" --source media/training-videos \
            --overwrite --output table

          # Correct content types so browsers stream instead of download
          for f in media/training-videos/*.mp4; do [ -e "$f" ] || continue
            az storage blob update --account-name "$STORAGE_ACCOUNT" --account-key "$KEY" \
              -c "$VIDEO_CONTAINER" -n "$(basename "$f")" --content-type video/mp4 --output none; done
          for f in media/training-videos/*.jpg; do [ -e "$f" ] || continue
            az storage blob update --account-name "$STORAGE_ACCOUNT" --account-key "$KEY" \
              -c "$VIDEO_CONTAINER" -n "$(basename "$f")" --content-type image/jpeg --output none; done

          echo "==> Blobs now in $VIDEO_CONTAINER:"
          az storage blob list -c "$VIDEO_CONTAINER" --account-name "$STORAGE_ACCOUNT" \
            --account-key "$KEY" --query "[].{name:name, mb:properties.contentLength}" -o table

      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          STAMP="$(date -u +%Y%m%d-%H%M)"
          TAG="${STAMP}-${SHORT_SHA}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${TAG}"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Update Container App
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${{ steps.meta.outputs.image }}" \
            --revision-suffix "r${{ steps.meta.outputs.tag }}" \
            --output none
          FQDN=$(az containerapp show -n "$CONTAINER_APP" -g "$AZURE_RESOURCE_GROUP" \
                  --query properties.configuration.ingress.fqdn -o tsv)
          echo "Deployed → https://$FQDN"

      - name: Smoke test
        run: |
          FQDN=$(az containerapp show -n "$CONTAINER_APP" -g "$AZURE_RESOURCE_GROUP" \
                  --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/training" || true)
            if [ "$CODE" = "200" ]; then echo "OK: /training returned 200"; exit 0; fi
            echo "Attempt $i: got $CODE, waiting..."; sleep 10
          done
          echo "Site did not return 200 after deploy"; exit 1
