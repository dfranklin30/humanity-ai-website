kind = "mobile"
previewPath = "/mobile/"
title = "Humanity + AI"
version = "1.0.0"
id = "artifacts/humanity-ai-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 24795

[services.development]
run = "pnpm --filter @workspace/humanity-ai-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/humanity-ai-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/humanity-ai-mobile", "run", "serve" ]

[services.env]
PORT = "24795"
BASE_PATH = "/mobile/"
