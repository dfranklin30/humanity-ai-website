kind = "web"
previewPath = "/"
title = "Humanity + AI, Inc."
version = "1.0.0"
id = "artifacts/humanity-ai-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19251

[services.development]
run = "pnpm --filter @workspace/humanity-ai-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/humanity-ai-website", "run", "build" ]
publicDir = "artifacts/humanity-ai-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19251"
BASE_PATH = "/"
